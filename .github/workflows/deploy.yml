name: DevOps CI/CD & Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Security Scan & Linting
  security-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Dockerfile Syntax
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

 # JOB 2: Real Auto-Deploy ke Ubuntu Server
  deploy:
    needs: security-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: SSH & Deploy ke Server Ubuntu
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e
            if [ -d "$HOME/project1" ]; then
              cd "$HOME/project1"
            elif [ -d "$HOME/devops/project1" ]; then
              cd "$HOME/devops/project1"
            else
              echo "Folder projek tidak dijumpai!" && exit 1
            fi
            
            git fetch --all
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            