<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project 1 | Nabil's Interactive Lab</title>
  <!-- Link ke fail CSS dalam public/css/ -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/animation.css">
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="container">
    <div class="badge">🚀 CI/CD DEPLOYED</div>
    <h1>Nabil's Lab</h1>
    <p>Selamat datang ke web interactive! Tekan butang di bawah untuk lihat efek animasi & counter live.</p>

    <div class="counter-box">
      <div style="font-size: 0.85rem; color: #888; margin-bottom: 5px;">LIVE INTERACTIVE SCORE</div>
      <div class="counter-val" id="counter">0</div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="addScore(event)">Boost +10 🔥</button>
      <button class="btn btn-accent" onclick="changeTheme(event)">Magic Colors ✨</button>
      <button class="btn btn-secondary" onclick="resetScore(event)">Reset 🔄</button>
    </div>
  </div>

  <!-- Link ke fail JS dalam public/js/ -->
  <script src="/js/particles.js"></script>
  <script src="/js/main.js"></script>
</body>
<footer>
  <p>&copy; 2023 Nabil's Interactive Lab. All rights reserved.</p>
</footer>
</html>
